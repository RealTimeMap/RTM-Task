# Интерфейс сервиса задач.
#
# Разворачивается независимо от бэкенда: свой образ, свой compose.
# Общее — только домен task.realtimemap.ru и сеть web, где их сводит
# traefik: /api/v1 и /socket.io уходят в бэкенд, остальное сюда.
#
# Запуск:
#   docker compose up -d --build

services:
  rtm-task-ui:
    image: ghcr.io/realtimemap/rtm-task-ui:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtm-task-ui
    restart: always
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "3"
    labels:
      - "traefik.enable=true"

      # Статика интерфейса. Приоритет ниже, чем у роутеров бэкенда:
      # /api/v1 и /socket.io должны уходить в него, а сюда — всё остальное.
      - "traefik.http.routers.rtm-task-ui.rule=Host(`task.realtimemap.ru`)"
      - "traefik.http.routers.rtm-task-ui.entrypoints=websecure"
      - "traefik.http.routers.rtm-task-ui.priority=10"
      - "traefik.http.routers.rtm-task-ui.service=rtm-task-ui"
      - "traefik.http.routers.rtm-task-ui.tls=true"

      # HTTP → HTTPS: интерфейс открывают из браузера руками,
      # и адрес без схемы должен доводить до рабочей страницы.
      - "traefik.http.routers.rtm-task-ui-http.rule=Host(`task.realtimemap.ru`)"
      - "traefik.http.routers.rtm-task-ui-http.entrypoints=web"
      - "traefik.http.routers.rtm-task-ui-http.priority=10"
      - "traefik.http.routers.rtm-task-ui-http.middlewares=rtm-task-ui-https"
      - "traefik.http.middlewares.rtm-task-ui-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.rtm-task-ui-https.redirectscheme.permanent=true"

      - "traefik.http.services.rtm-task-ui.loadbalancer.server.port=80"
    networks:
      - web
      # Нужна, чтобы nginx мог проксировать /api/v2/auth в auth-service.
      - service-network

networks:
  web:
    external: true
  service-network:
    external: true
    name: service-network

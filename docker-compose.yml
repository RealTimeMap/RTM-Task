# Интерфейс сервиса задач.
#
# Разворачивается независимо от бэкенда: свой образ, свой compose.
# Общее — только домен task.realtimemap.ru и сеть web, где их сводит
# traefik: /api/v1 и /socket.io уходят в бэкенд, остальное сюда.
#
# Запуск:
#   docker compose up -d --build

services:
  rtm-task-ui:
    image: ghcr.io/realtimemap/rtm-task:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtm-task-ui
    restart: always
    environment:
      # Адрес auth-service для nginx: он проксирует туда /api/v2/auth,
      # чтобы форма входа обращалась к своему origin и не упиралась в CORS.
      # Резолвится во время запроса, поэтому порядок запуска не важен.
      - AUTH_HOST=${AUTH_HOST:-realtime-map-backend:8001}
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "3"
    labels:
      - "traefik.enable=true"

      # Статика интерфейса. Приоритет ниже, чем у роутеров бэкенда:
      # /api/v1 и /socket.io должны уходить в него, а сюда — всё остальное.
      - "traefik.http.routers.rtm-task-ui.rule=Host(`${APP_DOMAIN:-task.realtimemap.ru}`)"
      - "traefik.http.routers.rtm-task-ui.entrypoints=websecure"
      - "traefik.http.routers.rtm-task-ui.priority=10"
      - "traefik.http.routers.rtm-task-ui.service=rtm-task-ui"
      - "traefik.http.routers.rtm-task-ui.tls=true"

      # Роутера на entrypoint web здесь нет намеренно: он слушает :82
      # внутри контейнера traefik, а наружу проброшен :80 — то есть на
      # обычный http-порт никто не отвечает, и редирект был бы мёртвым.
      # Остальные сервисы платформы живут так же, только на websecure.

      - "traefik.http.services.rtm-task-ui.loadbalancer.server.port=80"
    networks:
      - web
      # Нужна, чтобы nginx мог проксировать /api/v2/auth в auth-service.
      - service-network

networks:
  web:
    external: true
  service-network:
    external: true
    name: service-network
